name: Build release AIT (manual only)

# Explicit release only: confirmed dispatch or a manually pushed SHA-pinned release tag.
on:
  push:
    tags: ['ait-release/*']
  workflow_dispatch:
    inputs:
      confirm_release:
        description: '앱 개발이 최종 완료되었으며 공식 AIT 생성을 요청합니다'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_release == true) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ait-release/'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected release commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require latest development commit and explicit release intent
        shell: bash
        run: |
          set -euo pipefail
          release_branch_sha="$(git ls-remote origin refs/heads/feat/elliptical-train-ride | cut -f1)"
          test "$release_branch_sha" = "$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            release_tag_sha="${GITHUB_REF#refs/tags/ait-release/}"
            test "$release_tag_sha" = "$GITHUB_SHA"
          else
            test "$GITHUB_REF" = "refs/heads/feat/elliptical-train-ride"
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Log release identity
        run: |
          echo "Release commit: $GITHUB_SHA"
          echo "Run: $GITHUB_RUN_ID / attempt $GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Explicit final release build and validation
        run: npm run release:ait
      - name: Verify packaged live ad configuration and SDK argument contract
        run: node scripts/check-release-ad.mjs
      - name: Upload official AIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: merry-village-ait-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: merry-village.ait
          if-no-files-found: error
          retention-days: 14
