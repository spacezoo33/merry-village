name: Build web preview and AIT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Log source and build identity
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Run: $GITHUB_RUN_ID / number $GITHUB_RUN_NUMBER / attempt $GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Test build validation
        run: npm test

      - name: Build web preview
        run: npm run build:web

      - name: Build official AIT package
        run: npm run build:ait

      - name: Verify both outputs and embedded appName
        run: npm run verify:build

      - name: Upload web preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: merry-village-web-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload official AIT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: merry-village-ait-${{ github.run_number }}-${{ github.run_attempt }}-${{ github.sha }}
          path: merry-village.ait
          if-no-files-found: error
          retention-days: 14

      - name: Write download instructions
        run: |
          echo "### Merry Village build" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Web and AIT validated independently. Download the two ZIPs from this run's Artifacts section." >> "$GITHUB_STEP_SUMMARY"
          echo "The AIT ZIP contains merry-village.ait. Console upload/device testing is a separate step." >> "$GITHUB_STEP_SUMMARY"
