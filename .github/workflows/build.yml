name: Build web preview

on:
  push:
    branches: [main, feat/elliptical-train-ride]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Log source and build identity
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Run: $GITHUB_RUN_ID / number $GITHUB_RUN_NUMBER / attempt $GITHUB_RUN_ATTEMPT"
          git rev-parse HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Check, test, build and verify web only
        run: npm run build
      - name: Prepare Pages artifact from the development branch
        if: github.ref == 'refs/heads/feat/elliptical-train-ride' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Write build summary
        run: |
          echo "### Merry Village web preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Web-only validation completed. Pages uses its internal deployment artifact; no downloadable web ZIP was uploaded." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: build
    if: github.ref == 'refs/heads/feat/elliptical-train-ride' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: merry-village-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
      - name: Deploy development web preview
        id: deployment
        uses: actions/deploy-pages@v4
